
[/Script/Engine.RendererSettings]
// These settings are currently required for all visionOS projects.
vr.InstancedStereo=False
vr.MobileMultiView=True
xr.OpenXRAcquireMode=1

//Enable these settings for .mixed immesion mode, aka passthrough, AR.
//You will also need to edit UESwift.swift
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1
// Alpha invert pass is not required since we're using inline alpha invert
r.AlphaInvertPass=0
rhi.Metal.ResolveUsingRenderPass=True
; Set to 1 so the UE process fully exits when visionOS ends the OpenXR session
; (e.g., user presses the digital crown). 0 leaves the process alive in a zombie
; state, which makes the next launch land in "purgatory" (visionOS denies the
; immersive layer because the previous instance still owns it). See
; intelligence/techniques/ue-visionos-crown-exit-purgatory.md
xr.OpenXRExitAppOnRuntimeDrivenSessionExit=1

[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
// Immersive style (0 = Full Immersive, 1 = Mixed Immersive)
// Mixed = passthrough/AR — matches the alpha-propagation render settings above
// and the UIImmersionStyleMixed manifest entry in DefaultEngine.ini. Keeping all
// three consistent avoids the "manifest 'full' != runtime 'mixed'" launch warning.
ImmersiveStyle=1
// Upper limb visibility (0 = Hidden, 1 = Visible, 2 = Automatic)
// Temporarily set to 0 to see debug axis gizmos without passthrough hands
UpperLimbVisibility=0
bDisableUIApplicationSceneManifestGeneration=true
EnableFoveation=True

[SystemSettings]
; Shadow quality for the Stationary DirectionalLight's dynamic CSM over MOVABLE objects (hand,
; grabbed cubes, rotating sci-fi cube). On the mobile-forward visionOS path, a stationary light's
; dynamic shadows also need static+CSM shadow receivers enabled so static-lit meshes still receive
; the moving cascade. Per-light range is set on the DirectionalLight (DynamicShadowDistanceStationaryLight=2000).
; Dynamic CSM shadows DISABLED (0): they misbehave on the visionOS multiview path — per-eye,
; head-locked, the cascade follows the head so the light appears to rotate. Baked lighting (static
; objects) is unaffected. Revisit movable-object shadows later via a multiview-safe method (capsule/blob).
r.ShadowQuality=0
; Depth-fixup pass ON — clean test now that the dynamic shadows (the actual per-eye artifact) are off.
; If the glass goes smooth over passthrough, the fix works as-is; if IT shows a per-eye artifact, the
; multiview eye-index (SV_RenderTargetArrayIndex) needs the GetEyeIndex/StereoInput idiom.
r.Mobile.VisionOS.TranslucentWritesDepth=1
