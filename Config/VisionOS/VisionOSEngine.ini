
[/Script/Engine.RendererSettings]
// These settings are currently required for all visionOS projects.
vr.InstancedStereo=False
vr.MobileMultiView=True
xr.OpenXRAcquireMode=1
; SM5-LUMEN 2026-09-01: forward shading has no deferred GBuffer, so Lumen (a deferred-only
; feature) cannot run under it. bSupportsLumenGI=true was already gated on for METAL_SM5_IOS
; (Engine/Platforms/VisionOS/Config/DataDrivenPlatformInfo.ini), but that capability is inert
; while this project forces forward shading. Switching to deferred here is what actually lets
; Lumen execute once the SM5 shader platform is cooked+running (see bSupportsMetalMobileSM5
; below). See projects/fleet-manager/sm5-lumen-visionos-attempt-2026-09-01.md.
r.ForwardShading=False
// @AGILELENS (2026-08-16, superseding the note below from earlier the same day):
// r.Mobile.AntiAliasing=3 (MSAA) IS RESTORED HERE, DELIBERATELY, because it is currently the
// only known-working device config. Do not remove it without re-testing on device first.
//
// What actually happened today, in order:
// 1. Removed AA=0 from this file (see superseded note below) on the theory that MSAA-off was
//    breaking the @POLYARC inline alpha invert's dest-alpha read. That theory produced a WORSE
//    regression on device: with AA=3, ALL opaque geometry disappeared, leaving only alpha-blended
//    content (a translucent statue) visible.
// 2. Built a live alpha-mode cycler (ring-thumb-pinch, see PinchworkShowcaseSubsystem) to A/B the
//    @POLYARC inline invert vs Epic's stock r.AlphaInvertPass vs no inversion vs no alpha propagation
//    at all, without a rebuild per guess. All 5 modes looked IDENTICAL on device (confirmed via the
//    [ALPHAMODE] log - the cycler genuinely steps modes; nothing else changes). That rules out alpha
//    INVERSION CONVENTION as the variable - opaque geometry isn't reaching the alpha-invert step at
//    all under AA=3, regardless of which invert path runs.
// 3. Timing makes the real suspect MSAA + mobile-multiview array-texture creation
//    (MetalTexture.cpp ~657-667, bIsMSAARequired block) - a merge of Epic's 5.8 bindless-array
//    addition and the fork's own multiview-array addition, explicitly commented "kept BOTH
//    conditions". Device rendering on 5.8 never worked at all before this session's swapchain fix
//    (a3f1094a0a9c), and the FIRST post-fix render happened to run with AA=0 (the original leak),
//    so this MSAA+array code path was NEVER exercised on 5.8 device until step 1's change turned
//    AA on. The regression may be as old as the port itself, just never triggered until today.
// UNVERIFIED - this is the leading hypothesis, not a confirmed root cause. Flagged for a proper
// investigation (forced-flush diagnostic in the MSAA-array texture-creation path, comparing against
// 5.6 on the same device) rather than another guess-and-rebuild cycle.
//
// --- Superseded note, 2026-08-16 earlier same day ---
// r.Mobile.AntiAliasing=0 was added here on 2026-08-15 as a "visionOS Simulator accommodation",
// with the comment "Device is unaffected (DefaultEngine.ini's r.Mobile.AntiAliasing=3 stands
// there)". That claim was false - Config/VisionOS/ is the platform config for visionOS and the
// DEVICE reads it too, disproven from the physical AVP's own log
// (LogConfig: Set CVar [[r.Mobile.AntiAliasing:0]]). That part of the diagnosis still stands. What
// does NOT stand is the theory of WHY it mattered (alpha-invert dest-alpha reliability) - see above.
//
// The Simulator still needs AA=0; that belongs in the SIM BUILD SCRIPT (pinchwork-58-sim-fast.sh),
// which seds this file with trap-restore, NOT in committed config that both targets read.
;
; @AGILELENS 2026-08-16 — now FXAA, matching Epic's own 5.8 visionOS VR template.
; Epic commit 3f22905eae49 (jeff.fisher, UE-349453): "VisionOS MSAA break means that the vr template
; does not work out of the box. -Changed template inis so that we use FXAA rather than MSAA by
; default." MSAA is KNOWN-BROKEN on visionOS in 5.8 by Epic's own admission, so AA=3 is no longer the
; correct device value it was on 5.6 (see visionos-ue-passthrough-alpha-invert-fork.md for the 5.6
; baseline). Confirmed on device: AA=3 loses ALL opaque geometry; AA=0 renders everything
; semi-transparent (alpha~0 reaching the compositor).
;
; Why FXAA should matter for ALPHA, not just antialiasing: the @POLYARC inline invert is an in-place
; BF_InverseDestAlpha blend, so it needs an alpha-capable INTERMEDIATE to read dest-alpha from. On
; 5.6 MSAA provided exactly that (invert into Color.Target, then the MSAA resolve carries inverted
; alpha to the swapchain). With AA=0 the base pass renders straight to the backbuffer, the dest-alpha
; read fails, and alpha is never inverted. FXAA is a post-process, so it forces a SceneColor
; intermediate — restoring the same data-flow MSAA used to provide, without MSAA.
;
; r.Mobile.XRMSAAMode is already 0 via Config/DefaultDeviceProfiles.ini (verified on device:
; "Pushing Device Profile CVar: [[r.Mobile.XRMSAAMode:0 -> 0]]"), matching Epic's template.
;
; Epic's template also sets r.AlphaInvertPass=1, but this fork keeps 0 — the @POLYARC inline invert
; runs regardless of that cvar, so =1 would double-invert. Use the in-app ring-pinch alpha cycler to
; A/B inline-vs-stock on this new path rather than assuming which is right.
;
; > SUPERSEDED 2026-08-23 (CHIP-pinchwork-msaa-shadows): reverting to MSAA(3). vr58lab's current,
; > confirmed-working baseline on this SAME engine (port/visionos-5.8.1, ue581-port worktree, GUID
; > E5E4DB1D-2EEF-42C9-9F31-082BA5EE86A8 - see EngineAssociation in My_Project.uproject) runs
; > r.Mobile.AntiAliasing=3 + vr.MobileMultiView=True together with movable spot/point shadows, so
; > the AA=3-loses-all-opaque-geometry regression documented above appears to have been fixed by the
; > week of fork work between 2026-08-16 and today. Movable-light shadows additionally REQUIRE MSAA
; > on this platform - MobileHDR=False makes FXAA/TAA silently inert (no post-process runs), so AA=1
; > is not a real fallback for the shadow feature this chip needs. See
; > [[ue581-visionos-msaa-with-movable-light-shadows]]. If opaque geometry vanishes again on device,
; > this supersession is wrong - revert to AA=1 below and re-open the MetalTexture.cpp hypothesis.
;r.Mobile.AntiAliasing=1
;r.AntiAliasingMethod=1
; @AGILELENS 2026-08-30: RESTORED the device values -- the AA=0/AntiAliasingMethod=0 pair above was
; a LOCAL, UNCOMMITTED, DIAGNOSTIC-ONLY override (2026-08-28) for an unrelated same-engine sim
; control test against vr58's zero-draw-calls bug, explicitly flagged in its own comment as needing
; to be restored "before any device build" -- but this got packaged and installed to an actual
; device tonight, undoing the 2026-08-23 CHIP-pinchwork-msaa-shadows fix above. AA=0 is
; independently documented (this same file, 2026-08-16 history above) as causing "everything
; semi-transparent" on-device -- matches Alex's reported symptom on this exact build exactly.
; vr58lab's confirmed-working fork baseline (Config/VisionOS/VisionOSEngine.ini header, "VERIFIED-
; WORKING DEVICE CONFIG") uses AA=3 (MSAA) + rhi.Metal.ResolveUsingRenderPass=True (already set
; below) -- restoring that pairing here. r.Mobile.EarlyZPass=0 is left AS-IS: vr58lab's own
; device-measured comment (same file) confirms 0 is genuinely correct for this fork+multiview
; combo (EarlyZPass=1's full depth prepass resolve is broken for multiview-array on
; METAL_ES3_1_IOS -- a real engine bug, not a leftover diagnostic), so it was never wrong here.
r.Mobile.AntiAliasing=3
r.AntiAliasingMethod=3
r.Mobile.EarlyZPass=0

; --- movable local-light shadows: shader-permutation cvars, DUAL-INI RULE (BOTH iOS + VisionOS
; inis), then a clean cook. See [[ue581-visionos-msaa-with-movable-light-shadows]] section 3. ---
; OQ B9 diagnostic: UE 5.6.1 lacks the private-depth workaround used by the working 5.8.2 fork.
; OQ B8 enabled these and immediately hit SceneRendering.cpp:6021 on M5: the resulting forced
; full-depth-prepass array resolve requires SV_RenderTargetArrayIndex, then rendered one eye with
; the wrong alpha and both eyes as eye-locked planes. Disable both halves and clean-cook so this
; candidate matches vanilla Pinchwork's local-shadow permutation shape.
r.Mobile.EnableMovableSpotlightsShadow=0
r.Mobile.EnableMovablePointLightsShadows=0

//Enable these settings for .mixed immesion mode, aka passthrough, AR.
//You will also need to edit UESwift.swift
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1
// Alpha invert pass is not required since we're using inline alpha invert
; ALPHA FIX 2026-08-31 — match the WORKING vr58lab fork's alpha shape instead of guessing.
; Symptom: this app renders TRANSLUCENT on the M5 AVP (Alex: "all I see is the translucent statue")
; and semitransparent+overblown in Sam's visionOS sim. vr58lab on the SAME fork engine renders
; correctly on device.
; Measured delta between the two projects (both fork, both InlineAlphaInvert=1, both MSAA, both
; EarlyZPass=0):
;   Pinchwork FORK only:  r.AlphaInvertPass=0   AND no xr.OpenXRInvertAlpha
;   vr58lab  FORK only:   xr.OpenXRInvertAlpha=True  AND no r.AlphaInvertPass at all
; So Pinchwork was the ONLY app relying solely on InlineAlphaInvert, and the only one translucent
; on device. Adopting vr58lab's shape: drop the explicit disable, add OpenXRInvertAlpha.
; Revert: restore Config/VisionOS/VisionOSEngine.ini.alphafix-backup
;r.AlphaInvertPass=0
xr.OpenXRInvertAlpha=True
rhi.Metal.ResolveUsingRenderPass=True
// @AGILELENS 2026-08-30: four fork-required cvars this file never actually set on the ue581-port
// engine -- found by scripts/visionos-package-preflight.sh
// (intelligence/runbooks/packaging-visionos-fork-vs-vanilla.md). This project was verified working
// back on the older 5.6.1 fork branch; the 2026-08-23 migration to port/visionos-5.8.1 (commit
// "restore MSAA + add movable-shadow cvars") didn't carry these over, even though the sibling
// pinchwork-template project (copied from this one) hit the identical gap tonight. Copied verbatim
// from the device-verified reference (vr58lab/Config/VisionOS/VisionOSEngine.ini) -- NOT touching
// this file's own AA/EarlyZPass choices above, which are this project's own tuned values.
// NOT yet verified on-device.
r.Mobile.VisionOS.PrepassForcesSceneColor=1
r.Mobile.VisionOS.InlineAlphaInvert=1
r.Mobile.VisionOS.PrepassForcesKeepDepth=1
r.Mobile.VisionOS.BasePassIgnorePrepassDepth=0
; Set to 1 so the UE process fully exits when visionOS ends the OpenXR session
; (e.g., user presses the digital crown). 0 leaves the process alive in a zombie
; state, which makes the next launch land in "purgatory" (visionOS denies the
; immersive layer because the previous instance still owns it). See
; intelligence/techniques/ue-visionos-crown-exit-purgatory.md
xr.OpenXRExitAppOnRuntimeDrivenSessionExit=1

[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
// Immersive style (0 = Full Immersive, 1 = Mixed Immersive)
// Mixed = passthrough/AR — matches the alpha-propagation render settings above
// and the UIImmersionStyleMixed manifest entry in DefaultEngine.ini. Keeping all
// three consistent avoids the "manifest 'full' != runtime 'mixed'" launch warning.
ImmersiveStyle=1
// Upper limb visibility (0 = Hidden, 1 = Visible, 2 = Automatic)
// Temporarily set to 0 to see debug axis gizmos without passthrough hands
UpperLimbVisibility=0
bDisableUIApplicationSceneManifestGeneration=true
; SM5-LUMEN 2026-09-01: disabled for the SM5/Lumen experiment. Foveation attaches a
; rasterization-rate map, and MetalCommandEncoder.cpp:1072-1081 then force-overrides the
; viewport from that map — which destroys per-eye placement under the SM5 deferred path we're
; testing here. Revert to True once SM5/Lumen is verified stable, then re-test foveation
; independently. See projects/fleet-manager/sm5-lumen-visionos-attempt-2026-09-01.md.
EnableFoveation=False

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; SM5-LUMEN 2026-09-01: the actual reason SM5/SM6 have never run on this project — this cvar
; appeared in NO config anywhere, so IOSTargetPlatformSettings.cpp never cooks an SM5 shader
; format and MetalRHI falls through to ES3_1 at runtime regardless of DataDrivenPlatformInfo's
; capability gates. SM5 is NOT M5-exclusive (no Apple9 term gates it in MetalRHI.cpp), so this
; should cook and run on an M2 or in the Simulator too. Launch requires -metalmobilesm5 for
; bRequestedSM5 to be set (MetalRHI.cpp:350-351).
bSupportsMetalMobileSM5=True

[SystemSettings]
; Shadow quality for the Stationary DirectionalLight's dynamic CSM over MOVABLE objects (hand,
; grabbed cubes, rotating sci-fi cube). On the mobile-forward visionOS path, a stationary light's
; dynamic shadows also need static+CSM shadow receivers enabled so static-lit meshes still receive
; the moving cascade. Per-light range is set on the DirectionalLight (DynamicShadowDistanceStationaryLight=2000).
; Dynamic CSM shadows were DISABLED (0) because they misbehave on the visionOS multiview path —
; per-eye, head-locked, the cascade follows the head so the light appears to rotate. Baked lighting
; (static objects) is unaffected.
;
; EXPERIMENT 2026-08-16 (exp/device-shadows-58, Alex's ask): re-enable on UE 5.8 to find out whether
; the per-eye artifact still reproduces on a new engine version. The 0 above was set against 5.6.
; This is a single-variable change — r.Mobile.EnableStaticAndCSMShadowReceivers already defaults to 1
; (ConsoleManager.cpp:3962), so nothing else needs setting for static-lit meshes to receive the cascade.
; If the artifact is gone, this belongs on the shipping branch. If it reproduces, the next step is the
; per-view cascade hypothesis: FSceneView::GetShadowViewMatrices() (SceneView.cpp:1108) is only a debug
; freeze-camera hook, so cascades are fitted per-view with no stereo-pair combination — under multiview
; a cascade fitted to view 0 gets applied to both slices, which would produce exactly this symptom.
; DO NOT MERGE without an in-headset verdict.
r.ShadowQuality=3
; Diagnostic for M5-only one-eye geometry loss. Keep occlusion queries out of the
; multiview path so visibility from one eye cannot incorrectly cull the other.
r.AllowOcclusionQueries=False
; Depth-fixup pass ON — clean test now that the dynamic shadows (the actual per-eye artifact) are off.
; If the glass goes smooth over passthrough, the fix works as-is; if IT shows a per-eye artifact, the
; multiview eye-index (SV_RenderTargetArrayIndex) needs the GetEyeIndex/StereoInput idiom.
; Disabled for this probe because it is absent from the known-good fork projects and
; can confound the shared semi-transparency symptom.
;r.Mobile.VisionOS.TranslucentWritesDepth=1

; --- CHIP-pinchwork-msaa-shadows, 2026-08-23: movable spot/point-light shadows + MSAA together.
; See [[ue581-visionos-msaa-with-movable-light-shadows]] for the full mechanism (movable local-light
; shadows force a full depth prepass; ShadowMaskPrivateDepth routes that prepass into a private,
; renderer-owned depth array so it never collides with the MSAA base pass). Shader-permutation
; cvars above (r.Mobile.EnableMovableSpotlightsShadow / EnableMovablePointLightsShadows) are also
; set in Config/iOS/IOSEngine.ini — DUAL-INI RULE, both required, then a clean cook.
r.Mobile.VisionOS.ShadowMaskPrivateDepth=1

; Shadow stability — three independent culls that each cause "shadow blinks as I move" if left at
; device-profile defaults. Values below are what was verified stable on the AVP today; MinResolution=4
; permits soft shadows on tiny casters — try Fade=16/Min=8 if that reads badly in-headset (subjective,
; belongs to whoever is wearing it). See visionos-ue58-mobile-shadow-configuration.md §1d.
r.Shadow.RadiusThreshold=0.001
r.Shadow.FadeResolution=8
r.Shadow.MinResolution=4
; WORKAROUND, not a fix — the convex hull is suspected mis-built under mobile multiview (Views.Num()==1).
; Costs a real optimization (every caster in the light's range renders). See runbook §6 for the open question.
r.Shadow.LightViewConvexHullCull=0
