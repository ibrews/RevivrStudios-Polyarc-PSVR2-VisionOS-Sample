
[/Script/Engine.RendererSettings]
// These settings are currently required for all visionOS projects.
vr.InstancedStereo=False
vr.MobileMultiView=True
xr.OpenXRAcquireMode=1
// @AGILELENS (2026-08-16): DO NOT put `r.Mobile.AntiAliasing=0` in this file.
//
// It was added here on 2026-08-15 as a "visionOS Simulator accommodation", with the comment
// "Device is unaffected (DefaultEngine.ini's r.Mobile.AntiAliasing=3 stands there)". That claim is
// FALSE and was disproven from the physical AVP's own log:
//     LogConfig: Set CVar [[r.Mobile.AntiAliasing:0]]
//     LogConsoleManager: Warning: Setting 'r.Mobile.AntiAliasing' with 'SetByScalability' was
//     ignored as it is lower priority than the previous 'SetByProjectSetting'. Value remains '0'
//
// Config/VisionOS/ is the PLATFORM config for visionOS, and the visionOS platform covers the
// DEVICE as well as the Simulator - there is no separate simulator platform config. A platform
// config outranks DefaultEngine.ini, so this line silently disabled MSAA on device too.
//
// Why that matters beyond antialiasing: with MSAA off the scene renders straight to the backbuffer,
// and the @POLYARC inline alpha invert (MobileShadingRenderer.cpp) is an in-place BF_InverseDestAlpha
// blend whose dest-alpha read is unreliable in exactly that configuration - the same failure the
// 2026-08-15 session itself documented on METAL_SIM. A broken alpha invert composites the whole
// frame semi-transparently over passthrough in mixed immersion.
//
// The Simulator still needs AA=0. That belongs in the SIM BUILD SCRIPT, which already seds this file
// with trap-restore (see projects/ue-visionos-5.8-port/scripts/pinchwork-58-sim-fast.sh, which does
// the same for vr.MobileMultiView) - NOT in committed config that both targets read.
// Device therefore inherits DefaultEngine.ini's r.Mobile.AntiAliasing=3, matching 5.6.

//Enable these settings for .mixed immesion mode, aka passthrough, AR.
//You will also need to edit UESwift.swift
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1
// Alpha invert pass is not required since we're using inline alpha invert
r.AlphaInvertPass=0
rhi.Metal.ResolveUsingRenderPass=True
; Set to 1 so the UE process fully exits when visionOS ends the OpenXR session
; (e.g., user presses the digital crown). 0 leaves the process alive in a zombie
; state, which makes the next launch land in "purgatory" (visionOS denies the
; immersive layer because the previous instance still owns it). See
; intelligence/techniques/ue-visionos-crown-exit-purgatory.md
xr.OpenXRExitAppOnRuntimeDrivenSessionExit=1

[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
// Immersive style (0 = Full Immersive, 1 = Mixed Immersive)
// Mixed = passthrough/AR — matches the alpha-propagation render settings above
// and the UIImmersionStyleMixed manifest entry in DefaultEngine.ini. Keeping all
// three consistent avoids the "manifest 'full' != runtime 'mixed'" launch warning.
ImmersiveStyle=1
// Upper limb visibility (0 = Hidden, 1 = Visible, 2 = Automatic)
// Temporarily set to 0 to see debug axis gizmos without passthrough hands
UpperLimbVisibility=0
bDisableUIApplicationSceneManifestGeneration=true
EnableFoveation=True

[SystemSettings]
; Shadow quality for the Stationary DirectionalLight's dynamic CSM over MOVABLE objects (hand,
; grabbed cubes, rotating sci-fi cube). On the mobile-forward visionOS path, a stationary light's
; dynamic shadows also need static+CSM shadow receivers enabled so static-lit meshes still receive
; the moving cascade. Per-light range is set on the DirectionalLight (DynamicShadowDistanceStationaryLight=2000).
; Dynamic CSM shadows were DISABLED (0) because they misbehave on the visionOS multiview path —
; per-eye, head-locked, the cascade follows the head so the light appears to rotate. Baked lighting
; (static objects) is unaffected.
;
; EXPERIMENT 2026-08-16 (exp/device-shadows-58, Alex's ask): re-enable on UE 5.8 to find out whether
; the per-eye artifact still reproduces on a new engine version. The 0 above was set against 5.6.
; This is a single-variable change — r.Mobile.EnableStaticAndCSMShadowReceivers already defaults to 1
; (ConsoleManager.cpp:3962), so nothing else needs setting for static-lit meshes to receive the cascade.
; If the artifact is gone, this belongs on the shipping branch. If it reproduces, the next step is the
; per-view cascade hypothesis: FSceneView::GetShadowViewMatrices() (SceneView.cpp:1108) is only a debug
; freeze-camera hook, so cascades are fitted per-view with no stereo-pair combination — under multiview
; a cascade fitted to view 0 gets applied to both slices, which would produce exactly this symptom.
; DO NOT MERGE without an in-headset verdict.
r.ShadowQuality=3
; Depth-fixup pass ON — clean test now that the dynamic shadows (the actual per-eye artifact) are off.
; If the glass goes smooth over passthrough, the fix works as-is; if IT shows a per-eye artifact, the
; multiview eye-index (SV_RenderTargetArrayIndex) needs the GetEyeIndex/StereoInput idiom.
r.Mobile.VisionOS.TranslucentWritesDepth=1
