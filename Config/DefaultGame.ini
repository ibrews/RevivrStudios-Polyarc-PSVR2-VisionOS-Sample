; Asset Manager rule required by the GameFeatures plugin. The PSVR2 sample
; doesn't ship any GameFeatureData assets, but ECABridge (Mac-editor only
; via SupportedTargetPlatforms in .uproject) transitively enables
; GameFeatures, which logs a fatal Error during cook if no rule for
; GameFeatureData exists. Pointing it at /Game/Unused gives the cook a
; valid (empty) scan path. Remove if GameFeatures is ever dropped as a
; dependency.
