[StartupActions]
bAddPacks=True
InsertPack=(PackSource="StarterContent.upack",PackName="StarterContent")

[SectionsToSave]
+Section=StartupActions

; TravelTestMap is a duplicate of VRTemplateMap used by the pinky-pinch level-travel
; test (HandTrackingComponent). OpenLevel-by-name is not a cook-time reference, so the
; map must be listed here to be packaged. VRTemplateMap (the default map) is always
; cooked; listing it too keeps the set explicit.
[/Script/UnrealEd.ProjectPackagingSettings]
; 2026-09-09: matched from AgileLens/HalcyonVR @ Main55_AVP, which had video playing on AVP.
; It sets this explicitly; Lumenwork was relying on the UE default.
bSkipMovies=False
; 2026-09-09: stage Content/Movies as loose files. A FileMediaSource points at a real path on
; disk at runtime, so the mp4 must ship as NON-UFS -- inside a .pak AVFoundation cannot open it.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")
+MapsToCook=(FilePath="/Game/XRFramework/Levels/L_XRTemplateMovableTest")
+MapsToCook=(FilePath="/Game/VRTemplate/Maps/VRTemplateMap")
+MapsToCook=(FilePath="/Game/VRTemplate/Maps/TravelTestMap")

; These are loaded by string path at runtime (StaticLoadObject in HandTrackingComponent),
; not via a hard asset reference, so — like OpenLevel-by-name above — they must be
; force-cooked or they won't be packaged:
;  - the gesture Input Actions injected via Enhanced Input (IA_IndexThumbPinch_*, etc.)
;  - the per-level scene-load sounds played at BeginPlay (Light01 / Starter_Birds01)
;  - the Superman-fly feedback FX (Starter_Wind06 + P_Ambient_Dust) loaded by path in HandTrackingComponent
+DirectoriesToAlwaysCook=(Path="/Game/VRTemplate/Input/Actions")
; 2026-09-03: Alex's pawn (VRPawn_HandWorldControl) and its hand/pinch InputActions live under
; AVPTemplate. Reference-chasing does NOT find them: HandTrackingComponent loads them in its CDO
; CONSTRUCTOR, which the cooker cannot see. Without these, all 6 pinch InputActions failed to
; resolve at runtime (LogUObjectGlobals Error) and hand input was dead while rendering looked fine.
+DirectoriesToAlwaysCook=(Path="/Game/AVPTemplate/VRTemplate/Input")
+DirectoriesToAlwaysCook=(Path="/Game/AVPTemplate/WorldControl")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Particles")
; 2026-09-08: MATERIALS. Alex on the M5: "we are still getting world grid material on the blue cube".
; That is not a shader bug -- it is the engine's WorldGridMaterial fallback, which UE substitutes
; when a material fails to LOAD. The device log says exactly which ones did not make it into the cook:
;   LogUObjectGlobals: Warning: Failed to find object '/Game/VRTemplate/Materials/MI_Grid_Default'
;   LogUObjectGlobals: Warning: Failed to find object '/Game/VRTemplate/Materials/MI_Grid_Accent'
;   LogUObjectGlobals: Warning: Failed to find object '/Game/StarterContent/Materials/M_Rock_Marble_Polished'
; Same root cause as the Input/Actions entry above: these are resolved by PATH at runtime, so the
; cooker's reference chasing never sees them and silently omits them. Verify after the next cook with
; a device-log grep for "Failed to find object" -- it must come back empty.
+DirectoriesToAlwaysCook=(Path="/Game/VRTemplate/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Materials")

; NOTE: the GameFeatureData PrimaryAssetTypesToScan workaround that used to live here
; was removed once ECABridge stopped force-linking the GameFeatures plugin (now opt-in
; via ECABRIDGE_WITH_GAMEFEATURES). GameFeatures no longer loads, so the rule is
; unnecessary — and a rule whose AssetBaseClass can't resolve would itself trip the
; cold-cook asset scan. Re-add it only if you set ECABRIDGE_WITH_GAMEFEATURES=1 or
; otherwise enable Game Features.

