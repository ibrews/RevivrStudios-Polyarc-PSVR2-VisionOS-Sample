[SectionsToSave]
+Section=StartupActions

; TravelTestMap is a duplicate of VRTemplateMap used by the pinky-pinch level-travel
; test (HandTrackingComponent). OpenLevel-by-name is not a cook-time reference, so the
; map must be listed here to be packaged. VRTemplateMap (the default map) is always
; cooked; listing it too keeps the set explicit.
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/VRTemplate/Maps/VRTemplateMap")
+MapsToCook=(FilePath="/Game/VRTemplate/Maps/TravelTestMap")

; These are loaded by string path at runtime (StaticLoadObject in HandTrackingComponent),
; not via a hard asset reference, so — like OpenLevel-by-name above — they must be
; force-cooked or they won't be packaged:
;  - the gesture Input Actions injected via Enhanced Input (IA_IndexThumbPinch_*, etc.)
;  - the per-level scene-load sounds played at BeginPlay (Light01 / Starter_Birds01)
;  - the Superman-fly feedback FX (Starter_Wind06 + P_Ambient_Dust) loaded by path in HandTrackingComponent
+DirectoriesToAlwaysCook=(Path="/Game/VRTemplate/Input/Actions/Hands")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Particles")

; NOTE: the GameFeatureData PrimaryAssetTypesToScan workaround that used to live here
; was removed once ECABridge stopped force-linking the GameFeatures plugin (now opt-in
; via ECABRIDGE_WITH_GAMEFEATURES). GameFeatures no longer loads, so the rule is
; unnecessary — and a rule whose AssetBaseClass can't resolve would itself trip the
; cold-cook asset scan. Re-add it only if you set ECABRIDGE_WITH_GAMEFEATURES=1 or
; otherwise enable Game Features.

