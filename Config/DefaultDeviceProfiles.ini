; @AGILELENS 2026-09-02 — created to defeat a scalability override that broke MR compositing.
;
; PROBLEM: [EffectsQuality@2] in the engine's BaseScalability.ini sets r.SceneColorFormat=3
; (FloatR11G11B10 — NO ALPHA CHANNEL). On visionOS mixed reality that leaves the compositor with no
; usable alpha, so the ENTIRE SCENE renders semi-transparent over passthrough. Every alpha setting
; (xr.OpenXRInvertAlpha, r.Mobile.PropagateAlpha, r.PostProcessing.PropagateAlpha) was verified
; applied and correct — there was simply no alpha channel to write into.
;
; WHY HERE AND NOT [SystemSettings]/[RendererSettings]: scalability is applied AFTER those and wins.
; Device profile CVars are pushed after scalability (confirmed in the device log: scalability at
; :29.899, device profile at :29.908), so this is the layer that actually holds.
;
; WHY NOT -ExecCmds: ExecCmds runs ~0.8s after init, AFTER the render targets are already allocated
; at the wrong format. That is why the fix only took effect after a manual level reload. Setting it
; here makes it correct at allocation time — no reload needed.
;
; Full writeup: intelligence/techniques/visionos-mr-semitransparent-scalability-strips-alpha.md

; @AGILELENS 2026-09-02: r.Mobile.XRMSAAMode=0 was carried by the old [VisionPro DeviceProfile]
; section and was LOST when that section was replaced with [VisionOS]/[VisionProM5] for the alpha
; fix. Losing it re-enabled XR MSAA, which changes the sample count of the stereo depth target and
; hard-faults in FindStereoDepthTexture -> FOpenXRHMD::AllocateDepthTexture on the first rendered
; frame. Symptom was zero frames rendered, ~1s after "Engine is initialized".
; @AGILELENS 2026-09-02 — ROOT CAUSE FIX. BaseProfileName was EMPTY on [VisionOS], which SEVERED
; the device-profile inheritance chain and silently disabled the entire scalability pass.
;
; Engine stock chain (Engine/Config/BaseDeviceProfiles.ini):
;     VisionProM5 -> VisionPro -> IOS_High
;     VisionOS    -> VisionPro -> IOS_High
; What this file created instead:
;     VisionProM5 -> VisionOS -> (nothing)
; cutting VisionPro and IOS_High out entirely.
;
; EVIDENCE (device logs, cvar lines actually applied at runtime):
;     working runs  A/ALEX/FINAL (927/847/763 frames): 401 cvar lines, sg.EffectsQuality PRESENT
;     failing runs  (0 frames, 10 of them):            358 cvar lines, sg.EffectsQuality ABSENT
; ~43 cvars never applied, leaving device-inappropriate values, e.g.
;     r.LumenScene.GlobalSDF.Resolution 252 (should be 128)
;     r.MobileContentScaleFactor 1 (should be 2)
;     r.EarlyZPass 3 (should be 0)
;     sg.GlobalIlluminationQuality / EffectsQuality / ReflectionQuality 3 (should be 2)
; That is a far heavier render config than this device can carry, and it faults on the first frame.
;
; The one apparent counter-example (a run with sg.* present that still failed) was built with
; -skipbuild over a stale binary, so it cannot speak either way.
;
; DO NOT set BaseProfileName empty here again. If a profile needs a CVar, add the CVar and leave
; the parent pointing at the stock parent.
; @AGILELENS 2026-09-03 — Lumen scalability below, added to BOTH VisionOS profiles identically
; (not split by M2/M5). MEASURED on M5 (`projects/fleet-manager/RECEIPT-lumen-sm5-gpu-ab-2026-09-02.md`,
; 900-frame -csvGpuStats A/B, on-device): with Lumen ON, GPU/LumenScreenProbeGather is 12.99ms —
; 55% of the whole GPU frame — and it SCALES WITH EYE-BUFFER RESOLUTION, not with Lumen's own
; quality knobs. The same 900-frame sweep found ScreenProbeGather.DownsampleFactor and
; TracingOctahedronResolution move the frame <3% (one direction even made it WORSE), while cutting
; HMDRenderTarget 100->70 cut frame time 32.5% (26.61ms/37.6fps -> 17.97ms/55.7fps). So: don't
; reach for shadow/GI quality sliders here, they're not the lever for this cost.
;
; Still short of a 90Hz (11.1ms) budget even at 70% — nobody has picked a target framerate yet.
; 70% is the receipt's own tested value, used as a real, verified starting point.
;
; NOT split M2 vs M5: no repo (this one or the sibling Polyarc/Pinchwork sample) has ever shipped
; a chip-differentiated visionOS profile — VisionOS/VisionProM5 sections are byte-identical in both
; repos' DefaultDeviceProfiles.ini as of 2026-09-03. And the one same-build, same-OS A/B that DOES
; compare M2 vs M5 (`projects/m5-vs-m2-mobile-forward-chip/CHIP-m5-vs-m2-mobile-forward-baseline.md`,
; mobile-forward, no Lumen) found M5's GPUTime running ~1-1.9ms *higher* than M2's for identical
; content, not lower — so "M5 is strictly faster, give it a higher tier" is NOT what the measured
; data says. No Lumen-specific M2 capture exists (no M2 unit was connected this session — three AVP
; M2 units are on the roster but none were plugged in). Given that, applying the one real Lumen
; data point (M5) identically to both is the evidence-backed choice; splitting them would be a guess
; dressed up as a tier. If an M2 Lumen capture is taken later and it diverges meaningfully, split here.
;
; @AGILELENS 2026-09-03 — CORRECTION: the "MEASURED on M5" 70% number two paragraphs up was
; measured on a SIBLING project (RevivrStudios-Polyarc-PSVR2-VisionOS-Sample), not on Lumenwork
; itself (`projects/fleet-manager/RECEIPT-lumen-sm5-gpu-ab-2026-09-02.md` §Method says so plainly).
; Worse: this project's own `Content/XRFramework/Blueprints/BP_XRPawn` calls "Execute Console
; Command" with `xr.SecondaryScreenPercentage.HMDRenderTarget 120` in its BeginPlay graph
; (confirmed via `strings` on the .uasset — same literal string and value as the documented
; vr58lab silent-override trap, `intelligence/evals/briefs/2026-09-02-tier-ab-task3-hmd-rendertarget-override.md`).
; "Execute Console Command" sets the cvar at ECVF_SetByConsole — the HIGHEST priority in the
; engine, above ECVF_SetByDeviceProfile — so without a code-level fix, THIS SECTION'S
; HMDRenderTarget=70 IS SILENTLY STOMPED BACK TO 120 the instant BP_XRPawn spawns, on every level
; start, with no error. Fixed in `Source/My_Project/HMDStatusSubsystem.cpp`
; (`ReapplyDeviceProfileHMDRenderTarget`, bound to `UWorld::OnWorldBeginPlay` so it runs after
; the pawn's BeginPlay) — it snapshots this ini's value before the pawn can stomp it and
; re-applies it once, at the same ECVF_SetByConsole priority. Same applies to
; [Android_Adreno_Vulkan_SM5 DeviceProfile] below (BP_XRPawn is shared across platforms). Whatever
; real M5/Android numbers get captured next MUST be captured on a build that includes this fix, or
; they will silently be measuring 120%, not 70%. Not yet device-verified (needs a rebuild +
; on-device log check for the `[HMDRenderTarget-Fix]` line) — see
; departments/engineering/lumenwork-device-profiles-log.md.
[VisionOS DeviceProfile]
DeviceType=VisionOS
BaseProfileName=VisionPro
+CVars=r.SceneColorFormat=4
+CVars=r.Mobile.XRMSAAMode=0
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=70

; @AGILELENS 2026-09-04 — M5-specific split, backed by the first REAL (not borrowed) Lumenwork
; -csvGpuStats capture on this exact binary (build cdc87fd+, HMDRenderTarget-Fix confirmed active
; via the on-device [HMDRenderTarget-Fix] log line for both runs below). Two real M5 data points:
;   HMDRenderTarget=70: GPUTime 22.79ms mean (43.4fps) -- LumenScreenProbeGather 11.97ms (52.5%)
;   HMDRenderTarget=50: GPUTime 12.73ms mean (78.6fps), FrameTime median 11.13ms (~90fps) --
;                        LumenScreenProbeGather 6.09ms (47.8%)
; 70% (the previous shared value, itself only a same-project-family analogy until this session)
; comes in under half of visionOS's 90Hz budget. 50% lands the median frame at essentially the
; 11.1ms/90Hz target, with a real (not analogy) measurement -- this is now the evidence-backed
; value for M5 specifically. VisionOS (generic/M2) section below is UNCHANGED at 70 -- no M2 unit
; was available this session to confirm 50 (or any other value) is right for that chip; splitting
; M2 without its own data would repeat the "guess dressed up as a tier" mistake flagged above.
; Raw CSVs: ~/Archives/lumenwork-device-profiles-2026-09/. Full method + a bracketing 60% attempt
; (blocked mid-run when the headset was set down): departments/engineering/lumenwork-device-profiles-log.md.
[VisionProM5 DeviceProfile]
DeviceType=VisionOS
BaseProfileName=VisionPro
+CVars=r.SceneColorFormat=4
+CVars=r.Mobile.XRMSAAMode=0
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=50

; @AGILELENS 2026-09-03 — Android XR (Pico Swan, XREAL Aura) resolution scalability. Device log
; (both headsets, 2026-09-03) confirms both select this exact profile name at runtime:
; "Selected Device Profile [Android_Adreno_Vulkan_SM5]". Only Lumen frame COUNTS are measured here
; (Swan 356 frames, Aura 497 frames, no crash) — NOT per-pass GPU ms. Real capture was attempted
; this session (UE -csvGpuStats via `adb shell am start -e cmdline`) but the XR runtime is
; proximity-gated: with nobody wearing the headset, mWakefulness stays "Asleep" and no XR frames
; submit, so no CSV was ever produced — confirmed by direct dumpsys inspection, not inferred.
; adb KEYCODE_WAKEUP does not override the proximity sensor. This needs Alex physically wearing
; Swan/Aura for ~20-30s while `-csvGpuStats -csvCaptureFrames=1800` runs; logged as a blocker
; (`departments/engineering/lumenwork-device-profiles-log.md`).
;
; Separately: launching with `-csvGpuStats -csvCaptureFrames=1800` together (not either flag alone)
; produced one SIGSEGV in the PSOPrecompilePool thread out of 3 attempts on the Aura — an
; intermittent, unexplained engine-side crash, not a capture-method problem; flagging for whoever
; next has hands on this headset, don't assume the crash is caused by this config file.
;
; 70 (not the AVP receipt's exact value) chosen as a MORE conservative starting point than AVP's
; measured 70%, since Adreno mobile GPUs are architecturally different from Apple's TBDR and no
; direct measurement exists to confirm the same percentage buys the same relative win here. This is
; carried over BY ANALOGY from the AVP finding (LumenScreenProbeGather is resolution-bound, not
; quality-knob-bound — the same UE 5.8 SM5 Lumen code path runs on both platforms) — treat the
; specific number as an unverified placeholder, not a measured result, until captured on-device.
; Deliberately NOT setting DeviceType/BaseProfileName here — this section name matches an
; ENGINE-defined stock profile (confirmed selected at runtime in the device log), so this only
; needs to merge one CVar into the existing chain. Redeclaring DeviceType/BaseProfileName without
; knowing the stock parent risks repeating the exact "BaseProfileName severed the chain" bug this
; file's own history documents above for VisionOS — don't do that again.
[Android_Adreno_Vulkan_SM5 DeviceProfile]
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=70
