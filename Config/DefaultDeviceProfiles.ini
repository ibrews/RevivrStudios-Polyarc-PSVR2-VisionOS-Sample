; @AGILELENS 2026-09-02 — created to defeat a scalability override that broke MR compositing.
;
; PROBLEM: [EffectsQuality@2] in the engine's BaseScalability.ini sets r.SceneColorFormat=3
; (FloatR11G11B10 — NO ALPHA CHANNEL). On visionOS mixed reality that leaves the compositor with no
; usable alpha, so the ENTIRE SCENE renders semi-transparent over passthrough. Every alpha setting
; (xr.OpenXRInvertAlpha, r.Mobile.PropagateAlpha, r.PostProcessing.PropagateAlpha) was verified
; applied and correct — there was simply no alpha channel to write into.
;
; WHY HERE AND NOT [SystemSettings]/[RendererSettings]: scalability is applied AFTER those and wins.
; Device profile CVars are pushed after scalability (confirmed in the device log: scalability at
; :29.899, device profile at :29.908), so this is the layer that actually holds.
;
; WHY NOT -ExecCmds: ExecCmds runs ~0.8s after init, AFTER the render targets are already allocated
; at the wrong format. That is why the fix only took effect after a manual level reload. Setting it
; here makes it correct at allocation time — no reload needed.
;
; Full writeup: intelligence/techniques/visionos-mr-semitransparent-scalability-strips-alpha.md

; @AGILELENS 2026-09-02: r.Mobile.XRMSAAMode=0 was carried by the old [VisionPro DeviceProfile]
; section and was LOST when that section was replaced with [VisionOS]/[VisionProM5] for the alpha
; fix. Losing it re-enabled XR MSAA, which changes the sample count of the stereo depth target and
; hard-faults in FindStereoDepthTexture -> FOpenXRHMD::AllocateDepthTexture on the first rendered
; frame. Symptom was zero frames rendered, ~1s after "Engine is initialized".
; @AGILELENS 2026-09-02 — ROOT CAUSE FIX. BaseProfileName was EMPTY on [VisionOS], which SEVERED
; the device-profile inheritance chain and silently disabled the entire scalability pass.
;
; Engine stock chain (Engine/Config/BaseDeviceProfiles.ini):
;     VisionProM5 -> VisionPro -> IOS_High
;     VisionOS    -> VisionPro -> IOS_High
; What this file created instead:
;     VisionProM5 -> VisionOS -> (nothing)
; cutting VisionPro and IOS_High out entirely.
;
; EVIDENCE (device logs, cvar lines actually applied at runtime):
;     working runs  A/ALEX/FINAL (927/847/763 frames): 401 cvar lines, sg.EffectsQuality PRESENT
;     failing runs  (0 frames, 10 of them):            358 cvar lines, sg.EffectsQuality ABSENT
; ~43 cvars never applied, leaving device-inappropriate values, e.g.
;     r.LumenScene.GlobalSDF.Resolution 252 (should be 128)
;     r.MobileContentScaleFactor 1 (should be 2)
;     r.EarlyZPass 3 (should be 0)
;     sg.GlobalIlluminationQuality / EffectsQuality / ReflectionQuality 3 (should be 2)
; That is a far heavier render config than this device can carry, and it faults on the first frame.
;
; The one apparent counter-example (a run with sg.* present that still failed) was built with
; -skipbuild over a stale binary, so it cannot speak either way.
;
; DO NOT set BaseProfileName empty here again. If a profile needs a CVar, add the CVar and leave
; the parent pointing at the stock parent.
[VisionOS DeviceProfile]
DeviceType=VisionOS
BaseProfileName=VisionPro
+CVars=r.SceneColorFormat=4

[VisionProM5 DeviceProfile]
DeviceType=VisionOS
BaseProfileName=VisionPro
+CVars=r.SceneColorFormat=4
