; @AGILELENS 2026-09-02 (SM5+Lumen device crash fix): the iOS platform baseline
; (Engine/Config/IOS/BaseIOSEngine.ini:12) sets r.DistanceFields=0, which VisionOS inherits — so
; FLumenSceneDirectLightingTraceDistanceFieldShadowsCS is NEVER COOKED (0 occurrences in either cook
; log). But r.DistanceFieldShadowing defaults to 1, so Lumen's direct-lighting path still takes the
; distance-field branch at runtime and calls GetShader<...TraceDistanceFieldShadowsCS>() on a shader
; that does not exist -> hard crash 76ms after "Engine is initialized", inside
; RenderDirectLightingForLumenScene -> TraceDistanceFieldShadows.
; This is the SAME defect class as the r.ForwardShading cook/runtime mismatch fixed earlier tonight:
; a setting the COOK sees differs from what the RUNTIME asks for. Aligning the runtime to the cook.
; DURABLE FIX (engine-level, not done here): Lumen's DF-shadow consumer should gate on
; DoesPlatformSupportDistanceFields()/r.DistanceFields the same way its ShouldCompilePermutation does.
; 2026-09-02 REVISED: r.DistanceFieldShadowing=0 was NOT sufficient. Guarding the DF-shadow shader
; only moved the crash to FRadianceCacheTraceFromProbesCS (Lumen radiance-cache SOFTWARE ray
; tracing), which also needs distance fields. Lumen's final gather requires EITHER hardware ray
; tracing OR distance fields, and METAL_SM5_IOS has neither -- so guarding shaders one at a time is
; whack-a-mole. Enabling distance fields for this platform is the structural fix: it makes the
; shaders actually cook, satisfying every consumer instead of suppressing them one by one.
; The iOS baseline (Engine/Config/IOS/BaseIOSEngine.ini:12) sets r.DistanceFields=0 and VisionOS
; inherits it; this overrides that for this project.
r.DistanceFields=1
r.DistanceFieldShadowing=1
r.GenerateMeshDistanceFields=True

r.DynamicGlobalIlluminationMethod=1

r.ReflectionMethod=1

; @AGILELENS 2026-09-02 — LUMEN LITE (UE 5.8's medium-quality GI).
; r.Lumen.FinalGatherMethod, per the cvar's OWN help text in Lumen.cpp:
;   0 = Irradiance Field Gather  -- "Faster but lower quality GI. Targeted at mid range PC and Switch 2"
;   1 = Screen Probe Gather      -- "Higher quality GI"  (engine DEFAULT, what we were running)
; NOTE the cvar numbering is INVERTED relative to the internal ELumenFinalGatherMethod enum
; (ScreenProbeGather=0, IrradianceFieldGather=1). UseIrradianceFieldGather() correctly tests the
; CVAR == 0. Do not "fix" that comparison -- it looks wrong and is right.
; WHY: measured on the M5, GPU/LumenScreenProbeGather was 14.8ms = ~55% of the entire GPU frame,
; while GPU/LumenIrradianceFieldGather ran on 0 frames. Epic bills Lite as roughly 2x faster.
; BISECT 2026-09-02 (my call, not a reviewed decision): with this at 0 (Lumen Lite) the app died
; ~1s after 'Engine is initialized'. The cook log contained ZERO IrradianceField shader compiles --
; the same 'uncooked shader' signature as the Lumen distance-field crash fixed earlier today.
; Reverting to 1 (Screen Probe Gather, the engine default) to isolate the variable, since that is
; the value the long-running 900-frame captures used.
; To retry Lumen Lite: set 0 AND first verify irradiance-field shaders actually cook for
; METAL_SM5_IOS -- an empty grep in the cook log is the warning sign, not a clean bill of health.
r.Lumen.FinalGatherMethod=1
r.Mobile.AntiAliasing=3
r.AntiAliasingMethod=3
