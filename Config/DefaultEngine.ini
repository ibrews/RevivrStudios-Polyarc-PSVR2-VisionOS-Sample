; Editor side of the local-Swarm (Lightmass) message transport. On a multi-interface Mac
; (Tailscale/VPN) under macOS local-network privacy, UdpMessaging multicast is not delivered
; between the editor and UnrealLightmass, so static lighting bakes time out (60s) and fail.
; Reach Lightmass over a fixed loopback UNICAST channel instead: bind a fixed port and point
; a StaticEndpoint at Lightmass's fixed port. Lightmass uses the mirror config in
; Engine/Programs/UnrealLightmass/Config/DefaultEngine.ini (Unicast 0.0.0.0:6678, Static
; 127.0.0.1:6677). Keep the 0.0.0.0 bind — forcing loopback makes the multicast beacon error.
[/Script/UdpMessaging.UdpMessagingSettings]
EnableTransport=True
UnicastEndpoint=0.0.0.0:6677
+StaticEndpoints=127.0.0.1:6678

