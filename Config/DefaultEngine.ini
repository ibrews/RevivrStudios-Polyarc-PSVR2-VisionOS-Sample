; ALPHA FIX 2026-08-31 (attempt 3 — correct SECTION, verified against the working app's runtime log).
; Symptom: on device only the AUTHORED-translucent statue renders; every OPAQUE material is invisible.
; 36 opaque draws are SUBMITTED in PassType=0 with zero missing shader permutations, so the geometry
; draws and is then composited away — alpha=0 on opaque output, i.e. no alpha inversion happened.
; Runtime cvar diff, read from both apps' own device logs:
;   vr58lab   (renders correctly): xr.OpenXRInvertAlpha:1  and NO r.AlphaInvertPass at all
;   Pinchwork (opaque invisible) : OpenXRInvertAlpha never set, r.AlphaInvertPass:0
; Attempts 1 and 2 failed on PLACEMENT, not on the value:
;   attempt 1 -> Config/VisionOS/VisionOSEngine.ini : reached the staged config, never applied
;   attempt 2 -> DefaultEngine.ini [RendererSettings] : still never applied
; vr58lab declares it under [/Script/OpenXRHMD.OpenXRHMDSettings]. An xr.* cvar is owned by the OpenXR
; HMD settings object, so RendererSettings silently ignores it. Matching the reference exactly —
; file AND section.
xr.OpenXRInvertAlpha=True
