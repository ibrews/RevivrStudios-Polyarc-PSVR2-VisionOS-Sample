; Android-only overrides: Lumen on Vulkan SM5 (Pico Swan / XREAL Aura — Adreno 7xx/8xx).
; Scoped here so the shared DefaultEngine.ini (mobile-forward, tuned for visionOS) is untouched.
;
; Why this works without an engine change: Epic's own VULKAN_SM5_ANDROID DDPI
; (Engine/Config/Android/DataDrivenPlatformInfo.ini) declares MaxFeatureLevel=SM5 +
; bSupportsLumenGI=true, and RenderUtils.cpp's Lumen gate carries an explicit
; SP_VULKAN_SM5_ANDROID allowlist ("Android ... can't rely on SM6 yet, but want to run Lumen").
; The runtime device profile Android_Adreno_Vulkan_SM5 (BaseDeviceProfiles.ini) regex-matches
; "Adreno (TM) [7-8]xx" on Android >= 10 when SM5 is available — both headsets qualify.
;
; What the shared config gets wrong for this path, fixed below:
;   - bSupportsVulkanSM5 defaults false (BaseEngine.ini) — nothing SM5 was being cooked.
;   - r.ForwardShading=True fails the Lumen gate (!IsForwardShadingEnabled).
;   - vr.MobileMultiView is ES3.1-only; the SM5 deferred renderer stereo-renders via instanced stereo.
;   - MSAA is not available on the deferred renderer; TAA replaces it (TSR is too heavy here).

; NOTE: AndroidRuntimeSettings (bSupportsVulkanSM5, PackageName, ...) live in DefaultEngine.ini —
; that UObject config class is read from the host ini hierarchy, not from this platform file.
; Renderer cvars below ARE read per-platform by the cooker and at runtime on device.

[/Script/Engine.RendererSettings]
r.ForwardShading=False
; Stereo: mobile multiview is ES3.1-only. The cook warns "Instanced stereo rendering is not supported
; for SF_VULKAN_SM5_ANDROID", but the DEVICE log (Swan + Aura, 2026-09-03) reports
; FStereoShaderAspects: bInstancedStereo = 1 / bInstancedStereoNative = 0 and rendered 356/497 clean
; frames with it on — so keep True (measured) and treat the cook warning as noise. A/B knob: False = 2 passes.
vr.MobileMultiView=False
vr.InstancedStereo=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=2
r.Shadow.Virtual.Enable=0

[SystemSettings]
; Lumen software ray tracing needs distance fields (Lumen::IsSoftwareRayTracingSupported ==
; DoesProjectSupportDistanceFields). Stock Android_Vulkan_SM5 profile sets this too; pinned here
; so a device-profile mismatch can't silently drop it.
r.DistanceFields=1
; Cached on first call in the XR swapchain code; a non-zero value locks a 4x depth swapchain and
; asserts in AllocateDepthTexture. Same bug class as the visionOS SM5 frame-0 crash (2026-09-02).
r.Mobile.XRMSAAMode=0
; To A/B the cheaper "Medium GI" bucket (irradiance-field gather, Switch-2-tuned) on Adreno:
; sg.GlobalIlluminationQuality=1  (leave at default for full Screen Probe Gather first)
