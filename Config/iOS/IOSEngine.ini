[/Script/Engine.RendererSettings]
; For VisionOS, these must be enabled in both IOSEngine.ini & VisionOSEngine.ini because as of UE 5.5.3 at
; cook time, FShaderPlatformCachedIniValue maps EShaderPlatform::SP_METAL to ios rather than visionOS
vr.MobileMultiView=True

; @AGILELENS 2026-08-16 — the alpha settings were MISSING from this file, and that is very likely the
; root cause of the mixed-immersion "everything is semi-transparent" bug on device.
;
; Polyarc's own fork docs (https://polyarcgames.github.io/getting-started) state the rule the comment
; above already describes: "Settings affecting shader compilation must be specified in both
; IOSEngine.ini and VisionOSEngine.ini, as the engine maps Metal shader platform to iOS rather than
; VisionOS." Whoever set this project up applied that rule to vr.MobileMultiView and stopped there.
;
; r.Mobile.PropagateAlpha is ECVF_ReadOnly (MobileBasePassRendering.cpp:66) and gates
; IsMobilePropagateAlphaEnabled(), which drives BOTH the base-pass shader permutations AND
; bRequiresAlphaChannel for the scene-color allocation (SceneTextures.cpp:446). Setting it only in
; VisionOSEngine.ini meant the COOK compiled shaders WITHOUT alpha propagation, while the RUNTIME
; cvar still read 1 - so the device log looked correct (r.Mobile.PropagateAlpha:1,
; bProjectionLayerAlphaEnabled=1) and the alpha-invert passes ran, but the base pass never wrote
; meaningful alpha for them to invert.
;
; That explains why the in-headset alpha-invert cycler changed nothing across all 5 modes: inverting
; garbage alpha still yields garbage alpha. It also explains why neither AA=3 nor AA=0 helped - the
; problem was upstream of the invert entirely.
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1

; AA method also affects shader permutations (MSAA vs non-MSAA), so mirror it here too. FXAA per
; Epic's 5.8 visionOS template - see Epic commit 3f22905eae49 (jeff.fisher, UE-349453): "VisionOS
; MSAA break means that the vr template does not work out of the box."
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1
