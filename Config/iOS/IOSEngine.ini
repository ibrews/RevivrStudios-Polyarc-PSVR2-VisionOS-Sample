[/Script/Engine.RendererSettings]
; For VisionOS, these must be enabled in both IOSEngine.ini & VisionOSEngine.ini because as of UE 5.5.3 at
; cook time, FShaderPlatformCachedIniValue maps EShaderPlatform::SP_METAL to ios rather than visionOS
vr.MobileMultiView=True

; @AGILELENS 2026-08-16 — the alpha settings were MISSING from this file, and that is very likely the
; root cause of the mixed-immersion "everything is semi-transparent" bug on device.
;
; Polyarc's own fork docs (https://polyarcgames.github.io/getting-started) state the rule the comment
; above already describes: "Settings affecting shader compilation must be specified in both
; IOSEngine.ini and VisionOSEngine.ini, as the engine maps Metal shader platform to iOS rather than
; VisionOS." Whoever set this project up applied that rule to vr.MobileMultiView and stopped there.
;
; r.Mobile.PropagateAlpha is ECVF_ReadOnly (MobileBasePassRendering.cpp:66) and gates
; IsMobilePropagateAlphaEnabled(), which drives BOTH the base-pass shader permutations AND
; bRequiresAlphaChannel for the scene-color allocation (SceneTextures.cpp:446). Setting it only in
; VisionOSEngine.ini meant the COOK compiled shaders WITHOUT alpha propagation, while the RUNTIME
; cvar still read 1 - so the device log looked correct (r.Mobile.PropagateAlpha:1,
; bProjectionLayerAlphaEnabled=1) and the alpha-invert passes ran, but the base pass never wrote
; meaningful alpha for them to invert.
;
; That explains why the in-headset alpha-invert cycler changed nothing across all 5 modes: inverting
; garbage alpha still yields garbage alpha. It also explains why neither AA=3 nor AA=0 helped - the
; problem was upstream of the invert entirely.
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1

; AA method also affects shader permutations (MSAA vs non-MSAA), so mirror it here too.
;
; > SUPERSEDED 2026-08-23 (CHIP-pinchwork-msaa-shadows): the FXAA fallback below was correct for the
; > engine state that existed when it was set (2026-08-16) - Epic's own 5.8 visionOS template ships
; > FXAA because "VisionOS MSAA break means that the vr template does not work out of the box"
; > (Epic commit 3f22905eae49). Confirmed on `port/visionos-5.8.1` (ue581-port worktree, this
; > project's engine as of today): MSAA + vr.MobileMultiView=True is the working config on vr58lab's
; > current baseline (Config/VisionOS/VisionOSEngine.ini there), so the MSAA-breaks-opaque-geometry
; > bug hypothesized against MetalTexture.cpp's bIsMSAARequired block appears to have been fixed by
; > the intervening week of fork work. Reverting to MSAA(3) to get movable-shadow support (which
; > REQUIRES MSAA per [[ue581-visionos-msaa-with-movable-light-shadows]] - MobileHDR=False means
; > FXAA/TAA are silently inert anyway). If opaque geometry vanishes again on device, this
; > supersession is wrong and FXAA(1) is the fallback to revert to.
;r.Mobile.AntiAliasing=1
;r.AntiAliasingMethod=1
r.Mobile.AntiAliasing=3
r.AntiAliasingMethod=3

; --- movable local-light shadows: shader-permutation cvars, DUAL-INI RULE (BOTH iOS + VisionOS
; inis), then a clean cook. See [[ue581-visionos-msaa-with-movable-light-shadows]] section 3. ---
; OQ B9 diagnostic: keep the cook-time half aligned with VisionOSEngine.ini. OQ B8 proved that
; enabling these on the UE 5.6.1 root forces the unsupported multiview array-depth resolve path.
r.Mobile.EnableMovableSpotlightsShadow=0
r.Mobile.EnableMovablePointLightsShadows=0

; @AGILELENS 2026-09-02 — bSupportsMetalMobileSM5 MUST be here too, not only in VisionOSEngine.ini.
; This is the third time the dual-ini rule documented at the top of this file has been missed
; (vr.MobileMultiView, then r.Mobile.PropagateAlpha, now this one).
;
; It gates IOSTargetPlatformSettings::GetAllPossibleShaderFormats (IOSTargetPlatformSettings.cpp
; ~206-215), which decides WHICH SHADER FORMATS ARE COOKED — so it is squarely a
; "setting affecting shader compilation" and follows the iOS-not-visionOS mapping rule above.
;
; Proof it was needed: with the flag set ONLY in VisionOSEngine.ini, a full cook compiled
; METAL_ES3_1_IOS (147 shadermaps) and METAL_SIM (27) and ZERO METAL_SM5 — i.e. it would have
; produced a green build that silently ran ES3_1 on device, the exact silent fallback that made the
; 2026-08-22 SM6 attempt look successful. Caught mid-cook by grepping the shader formats rather than
; waiting for the device log.
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
bSupportsMetalMobileSM5=True
