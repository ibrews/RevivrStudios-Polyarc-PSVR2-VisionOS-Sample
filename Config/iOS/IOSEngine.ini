[/Script/Engine.RendererSettings]
; For VisionOS, these must be enabled in both IOSEngine.ini & VisionOSEngine.ini because as of UE 5.5.3 at
; cook time, FShaderPlatformCachedIniValue maps EShaderPlatform::SP_METAL to ios rather than visionOS
vr.MobileMultiView=True

; exp/sm6-lumen-58: ForwardShading affects shader permutations (forward vs deferred), mirror it here
; per the same dual-ini rule. M5-only build, see DefaultEngine.ini for the full rationale.
r.ForwardShading=False
r.Lumen.Supported=1

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; exp/sm6-lumen-58: SM6 shader format selection happens at cook time (IOSTargetPlatformSettings.cpp
; SupportsMetalMobileSM6() reads this key), so it must be mirrored here too.
bSupportsMetalMobileSM6=True

; @AGILELENS 2026-08-16 — the alpha settings were MISSING from this file, and that is very likely the
; root cause of the mixed-immersion "everything is semi-transparent" bug on device.
;
; Polyarc's own fork docs (https://polyarcgames.github.io/getting-started) state the rule the comment
; above already describes: "Settings affecting shader compilation must be specified in both
; IOSEngine.ini and VisionOSEngine.ini, as the engine maps Metal shader platform to iOS rather than
; VisionOS." Whoever set this project up applied that rule to vr.MobileMultiView and stopped there.
;
; r.Mobile.PropagateAlpha is ECVF_ReadOnly (MobileBasePassRendering.cpp:66) and gates
; IsMobilePropagateAlphaEnabled(), which drives BOTH the base-pass shader permutations AND
; bRequiresAlphaChannel for the scene-color allocation (SceneTextures.cpp:446). Setting it only in
; VisionOSEngine.ini meant the COOK compiled shaders WITHOUT alpha propagation, while the RUNTIME
; cvar still read 1 - so the device log looked correct (r.Mobile.PropagateAlpha:1,
; bProjectionLayerAlphaEnabled=1) and the alpha-invert passes ran, but the base pass never wrote
; meaningful alpha for them to invert.
;
; That explains why the in-headset alpha-invert cycler changed nothing across all 5 modes: inverting
; garbage alpha still yields garbage alpha. It also explains why neither AA=3 nor AA=0 helped - the
; problem was upstream of the invert entirely.
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1

; AA method also affects shader permutations (MSAA vs non-MSAA), so mirror it here too. FXAA per
; Epic's 5.8 visionOS template - see Epic commit 3f22905eae49 (jeff.fisher, UE-349453): "VisionOS
; MSAA break means that the vr template does not work out of the box."
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1

; ---------------------------------------------------------------------------------------------
; SM6 LINK FIX (2026-08-20). Without this, an SM6-enabled visionOS build fails to LINK with:
;   ld: building for 'visionOS', but linking in dylib ... built for 'iOS'
;
; Engine/Config/IOS/BaseIOSEngine.ini:142-143 sets [ShaderPlatformConfig METAL_SM6_IOS]
; BindlessConfiguration=All (METAL_ES3_1_IOS and METAL_SM5_IOS are both "Disabled"). Once
; bSupportsMetalMobileSM6=True, ShouldIncludeMetalShaderConverterForIOS() therefore returns true
; (MetalShaderConverter.build.cs:13-58, mirrored at UEBuildIOS.cs:827-872), which makes the build
; embed + link Binaries/ThirdParty/Apple/MetalShaderConverter/IOS/libmetalirconverter -- and only
; IOS/Mac/Windows slices of that dylib exist. There is no visionOS slice (stock Epic 5.8 carries
; the same "TODO: tvOS and VisionOS"), so the link is a hard platform mismatch.
;
; Overriding BindlessConfiguration to Disabled here turns that gate off, which switches OFF BOTH
; coupled defines together and therefore cannot reintroduce the 45 "incomplete type" errors that
; b59e94a93635 fixed -- PLATFORM_SUPPORTS_BINDLESS_RENDERING=1 is added ONLY inside the same
; `if (ShouldIncludeMetalShaderConverterForIOS(Target))` block that sets
; METAL_USE_METAL_SHADER_CONVERTER=1 (UEBuildIOS.cs:1254-1257). MetalBindlessDescriptors.cpp then
; compiles out entirely and libmetalirconverter is never linked.
;
; SM6 is still SELECTED at runtime: MetalRHI.cpp:368's SM6 branch does NOT consult
; GetBindlessConfigurationOnStartup() -- unlike the SM5 (:375) and ES3.1 (:382) branches, which do.
; SM6 shader COMPILATION is SPIRV-Cross based (MetalCompileShaderSPIRV.cpp) and the Metal Shader
; Converter it needs at COOK time is the Mac dylib, which does exist. Only the RUNTIME embedded
; framework was ever missing.
;
; Cost of disabling bindless on SM6: bindless resource binding is off, so Nanite/Lumen/VSM run
; through the bound-resource path. That is a perf question, not a capability question -- measure it
; on the M5 rather than assuming. Re-enabling requires a real visionOS libmetalirconverter slice
; from Apple, which does not exist as of Xcode 26.
[ShaderPlatformConfig METAL_SM6_IOS]
BindlessConfiguration=Disabled
